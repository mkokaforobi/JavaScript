<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Results Summary</title>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

	<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">

	<link rel="stylesheet" href="style.css">
</head>

<body>

	<main class="page">

		<div class="decoration quote" aria-hidden="true">”</div>

	<div class="decoration dots" aria-hidden="true"></div>

		<div class="decoration left-curve" aria-hidden="true"></div>
		<div class="decoration right-curve" aria-hidden="true"></div>
		<div class="decoration zigzag" aria-hidden="true"></div>

		<section class="display-area">

			<div class="result-card">

				<section class="result-panel">

					<h1>Your Result</h1>

					<div class="score-circle">
						<strong>76</strong>
						<span>of 100</span>
					</div>

					<h2>Great</h2>

					<p>
						You scored higher than 65% of<br class="desktop-break">
						the people who have taken<br class="desktop-break">
						these tests.
					</p>

				</section>


				<section class="summary-panel">

					<h2>Summary</h2>

					<div class="score-row reaction">

						<div class="category">
							<span class="symbol">ϟ</span>
							<span>Reaction</span>
						</div>

						<p>
							<strong>80</strong>
							<span> / 100</span>
						</p>

					</div>


					<div class="score-row memory">

						<div class="category">
							<span class="symbol">◉</span>
							<span>Memory</span>
						</div>

						<p>
							<strong>92</strong>
							<span> / 100</span>
						</p>

					</div>


					<div class="score-row verbal">

						<div class="category">
							<span class="symbol">◷</span>
							<span>Verbal</span>
						</div>

						<p>
							<strong>61</strong>
							<span> / 100</span>
						</p>

					</div>


					<div class="score-row visual">

						<div class="category">
							<span class="symbol">◎</span>
							<span>Visual</span>
						</div>

						<p>
							<strong>73</strong>
							<span> / 100</span>
						</p>

					</div>


					<button class="continue-button" type="button">
						Continue
					</button>

				</section>

			</div>

		</section>

	</main>

</body>
</html>
